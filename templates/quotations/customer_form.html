{% extends "quotations/base.html" %}
{% block title %}{% if customer %}Edit{% else %}Add{% endif %} Customer{% endblock %}
{% block content %}
<div class="page-title">
    <div><h1>{% if customer %}Edit{% else %}Add{% endif %} Customer</h1></div>
</div>
<div class="card">
<form method="post">
{% csrf_token %}
<div class="grid-2">
<div class="field"><label>Customer Name *</label><input name="name" required value="{{ customer.name|default:'' }}"></div>
<div class="field"><label>WhatsApp Number *</label><input name="whatsapp_number" required value="{{ customer.whatsapp_number|default:'' }}" placeholder="919876543210"></div>
<div class="field"><label>Email</label><input type="email" name="email" value="{{ customer.email|default:'' }}"></div>
<div class="field"><label>Address</label><textarea name="address">{{ customer.address|default:'' }}</textarea></div>
</div>
<div class="actions">
<button class="btn success">Save Customer</button>
<a class="btn secondary" href="{% url 'customer_list' %}">Cancel</a>
</div>
</form>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Interior Quote{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #17202a;
        }
        .navbar {
            height: 68px;
            background: #172a35;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }
        .brand { font-size: 23px; font-weight: 700; }
        .brand span { color: #f39c12; }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 8px;
            padding: 9px 12px;
            border-radius: 6px;
        }
        .nav a:hover { background: #243f4d; }
        .container { max-width: 1250px; margin: 28px auto; padding: 0 20px; }
        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 22px;
        }
        h1, h2, h3 { margin-top: 0; }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 18px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 18px;
        }
        .stat {
            background: #fff;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }
        .stat small { color: #6c757d; }
        .stat strong { display: block; font-size: 28px; margin-top: 8px; }
        label { display: block; font-weight: 600; margin-bottom: 7px; }
        input, select, textarea {
            width: 100%;
            border: 1px solid #d7dde2;
            border-radius: 6px;
            padding: 10px;
            font: inherit;
        }
        textarea { min-height: 100px; resize: vertical; }
        .field { margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #243d4a;
            color: white;
            text-align: left;
            padding: 11px;
        }
        td { padding: 10px; border-bottom: 1px solid #e5e7e9; vertical-align: middle; }
        .table-wrap { overflow-x: auto; }
        .btn {
            border: 0;
            border-radius: 6px;
            padding: 10px 15px;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
            font-size: 14px;
        }
        .primary { background: #172a35; color: white; }
        .success { background: #198754; color: white; }
        .danger { background: #dc3545; color: white; }
        .secondary { background: #6c757d; color: white; }
        .warning { background: #f39c12; color: #111; }
        .muted { color: #6c757d; }
        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            background: #eaf4ff;
        }
        .right { text-align: right; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .total-box { max-width: 410px; margin-left: auto; margin-top: 18px; }
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
        }
        .grand {
            border-top: 2px solid #172a35;
            margin-top: 5px;
            padding-top: 12px;
            font-size: 19px;
            font-weight: 700;
        }
        @media(max-width:800px) {
            .grid-3, .grid-2 { grid-template-columns: 1fr; }
            .navbar { padding: 0 14px; }
            .nav a { margin-left: 0; }
        }
        @media print {
            .navbar, .no-print { display: none !important; }
            body { background: #fff; }
            .container { max-width: none; margin: 0; }
            .card { box-shadow: none; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="brand">Interior<span>Quote</span></div>
    <div class="nav">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'customer_list' %}">Customers</a>
        <a href="{% url 'product_list' %}">Products</a>
        <a href="{% url 'quotation_create' %}">New Quotation</a>
        <a href="/admin/">Admin</a>
    </div>
</nav>

<main class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
